name: iOS 持续集成

on:
  push:
    branches:
      - codex/ios-adaptation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 选择 iPhone 模拟器
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; phones=[x for group in d.values() for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")]; preferred=next((x for x in phones if x["name"].startswith("iPhone 16")), phones[0]); print(preferred["udid"])')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: 执行 iOS 测试
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lujian.xcodeproj \
            -scheme Lujian \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: 上传失败测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_number }}
          path: ios/build/TestResults.xcresult
          if-no-files-found: ignore
