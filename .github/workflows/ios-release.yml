name: iOS 全流程测试与预发布

on:
  push:
    branches:
      - codex/ios-adaptation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    name: 测试、安装、打包与发布
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 执行全流程测试与打包
        run: ./ios/ci/test-and-package.sh

      - name: 上传测试与安装包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lujian-iOS-1.0.0-${{ github.run_number }}
          path: |
            ios/build/release/*
            ios/build/LujianTests.xcresult
            ios/build/xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: 创建 iOS 预发布
        run: >-
          gh release create "ios-v1.0.0-ci.${GITHUB_RUN_NUMBER}"
          ios/build/release/*
          --prerelease
          --target "$GITHUB_SHA"
          --title "旅笺 iOS 1.0.0 CI ${GITHUB_RUN_NUMBER}"
          --notes-file docs/releases/ios-v1.0.0.md
        env:
          GH_TOKEN: ${{ github.token }}
