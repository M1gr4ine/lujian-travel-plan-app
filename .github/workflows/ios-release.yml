name: iOS 全流程测试与正式发布

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 正式发布标签
        required: true
        default: ios-v1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: ios-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  test-build-release:
    name: 测试、安装、打包与发布
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 执行全流程测试与打包
        run: ./ios/ci/test-and-package.sh

      - name: 上传测试与安装包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lujian-iOS-1.0.0-${{ github.run_number }}
          path: |
            ios/build/release/*
            ios/build/LujianTests.xcresult
            ios/build/xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: 创建 iOS 正式发布
        run: >-
          gh release create "${{ inputs.release_tag }}"
          ios/build/release/*
          --target "$GITHUB_SHA"
          --title "旅笺 iOS 1.0.0"
          --notes-file docs/releases/ios-v1.0.0.md
        env:
          GH_TOKEN: ${{ github.token }}
